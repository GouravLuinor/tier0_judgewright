services:
  judgewright:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: norai-judgewright
    restart: unless-stopped
    ports:
      - "127.0.0.1:3005:3005"
    environment:
      - NODE_ENV=production
      - PORT=3005
      - HOSTNAME=0.0.0.0
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3005/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional Automated HTTPS Reverse Proxy (Caddy with Auto-SSL)
